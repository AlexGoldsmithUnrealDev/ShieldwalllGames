name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish only the website. Working notes (CLAUDE.md, README files,
      # MEDIA_CHECKLIST.md), the design-system archive, the .docx brief and
      # build scripts stay in the repository but are not served.
      - name: Assemble public site
        run: |
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          cp -a . "$SITE/"
          cd "$SITE"
          rm -rf .git .github .gitignore "Mimir Design System"
          find . -name '*.md' -delete
          find . -name '*.docx' -delete
          rm -rf tools
          rm -f mimir/scripts/generate-*.js
          test -f index.html && test -f CNAME && test -f mimir/index.html && test -f mimir/data/features.json && test -f mimir/roadmap-data.json
          ! test -e CLAUDE.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
