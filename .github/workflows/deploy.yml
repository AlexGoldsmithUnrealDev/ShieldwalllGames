name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Least privilege: read the repo, publish to Pages. Actions are pinned to
# exact commits (tag in the comment) so a moved tag cannot change what runs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # Publish only the website. Working notes (CLAUDE.md, README files),
      # design handovers (docs/) and build tools stay in the repository but
      # are not served.
      - name: Assemble public site
        run: |
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          cp -a . "$SITE/"
          cd "$SITE"
          rm -rf .git .github .gitignore
          find . -name '*.md' -delete
          find . -name '*.docx' -delete
          rm -rf tools docs
          test -f index.html && test -f CNAME && test -f vitus/index.html && test -f ashborn/index.html
          ! test -e CLAUDE.md
          ! test -e docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
