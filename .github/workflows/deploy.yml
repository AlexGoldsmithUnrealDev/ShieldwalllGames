name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish only the website. Working notes (CLAUDE.md, README files),
      # design handovers (docs/) and build tools stay in the repository but
      # are not served.
      - name: Assemble public site
        run: |
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          cp -a . "$SITE/"
          cd "$SITE"
          rm -rf .git .github .gitignore
          find . -name '*.md' -delete
          find . -name '*.docx' -delete
          rm -rf tools docs
          test -f index.html && test -f CNAME && test -f vitus/index.html && test -f ashborn/index.html
          ! test -e CLAUDE.md
          ! test -e docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
